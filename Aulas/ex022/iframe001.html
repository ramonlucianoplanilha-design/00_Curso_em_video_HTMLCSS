<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando iframe</title>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando um site 
        <!-- Tamanho padrão 300 x 150 -->
        <iframe src="https://www.rocketseat.com.br/" frameborder="1" height="500" width="300" scrolling="yes">
            Texto só parece quando o navegador não é compatível.
            Pode ser colocado um link também.
        </iframe>
        
        teste para aprender a programar</p>

        <iframe src="https://www.rocketseat.com.br/" frameborder="0" height="500" width="300" scrolling="no">
            Texto só parece quando o navegador não é compatível.
            Pode ser colocado um link também.
        </iframe>
        
        teste para aprender a programar</p>    
    
    
</body>
</html>
